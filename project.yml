name: Universe
options:
  bundleIdPrefix: com.universe
  deploymentTarget:
    macOS: "15.0"
packages:
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    from: "6.20.3"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.universe.app
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Info.plist
    SWIFT_VERSION: "5.0"
targets:
  Universe:
    type: application
    platform: macOS
    sources:
      - Sources/Universe
      - path: Resources/sound-step.mp3
        buildPhase: resources
      - path: Resources/notification.mp3
        buildPhase: resources
      - path: Resources/avatar_pack.riv
        buildPhase: resources
    dependencies:
      - package: RiveRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universe.app
