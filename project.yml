name: Universe
options:
  bundleIdPrefix: com.universe
  deploymentTarget:
    macOS: "15.0"
packages:
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    from: "6.20.3"
  kokoro-ios:
    url: https://github.com/mlalma/kokoro-ios.git
    from: "1.0.11"
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: "0.30.2"
  MLXUtilsLibrary:
    url: https://github.com/mlalma/MLXUtilsLibrary.git
    exactVersion: "0.0.6"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.universe.app
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: NSD8UNQK9J
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Info.plist
    CODE_SIGN_ENTITLEMENTS: Universe.entitlements
    SWIFT_VERSION: "5.0"
targets:
  Universe:
    type: application
    platform: macOS
    sources:
      - Sources/Universe
      - path: Resources/sound-step.mp3
        buildPhase: resources
      - path: Resources/notification.mp3
        buildPhase: resources
      - path: Resources/avatar_pack.riv
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: RiveRuntime
      - package: kokoro-ios
        product: KokoroSwift
        embed: true
      - package: mlx-swift
        product: MLX
      - package: MLXUtilsLibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universe.app
