name: Universe
options:
  bundleIdPrefix: com.universe
  deploymentTarget:
    macOS: "15.0"
packages:
  ThinkingOrbsKit:
    path: Vendor/ThinkingOrbsKit
  kokoro-ios:
    url: https://github.com/mlalma/kokoro-ios.git
    exactVersion: "1.0.11"
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: "0.30.2"
  MLXUtilsLibrary:
    url: https://github.com/mlalma/MLXUtilsLibrary.git
    exactVersion: "0.0.6"
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: "153.0.0"
  BorderBeamKit:
    path: Vendor/BorderBeamKit
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.universe.app
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: NSD8UNQK9J
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Info.plist
    CODE_SIGN_ENTITLEMENTS: Universe.entitlements
    SWIFT_VERSION: "5.0"
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES
targets:
  Universe:
    type: application
    platform: macOS
    sources:
      - path: Sources/Universe
        excludes:
          - ResearchTemplates
      - path: Sources/Universe/ResearchTemplates
        type: folder
        buildPhase: resources
      - path: Resources/sound-step.mp3
        buildPhase: resources
      - path: Resources/notification.mp3
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Release/Licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: ThinkingOrbsKit
      - package: kokoro-ios
        product: KokoroSwift
        embed: true
      - package: mlx-swift
        product: MLX
      - package: MLXUtilsLibrary
      - package: WebRTC
      - package: BorderBeamKit
    settings:
      base:
        # The app is called Astro. The bundle ID, Keychain service and data
        # folder keep their original "universe" names on purpose: changing them
        # would drop macOS permissions, sign-ins and saved chats.
        PRODUCT_BUNDLE_IDENTIFIER: com.universe.app
        PRODUCT_NAME: Astro
